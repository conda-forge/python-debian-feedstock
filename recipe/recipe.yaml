# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.1.1"
  python_check_max: "3.14"

package:
  name: python-debian
  version: ${{ version }}

source:
  - target_directory: dist
    url: https://pypi.org/packages/source/p/python-debian/python_debian-${{ version }}.tar.gz
    sha256: fe4fc3dc798dbf1f0ef5865e2b1b4f7cc0352b6a511b25ab7594906c64a73629
  - target_directory: src
    url: https://salsa.debian.org/python-debian-team/python-debian/-/archive/${{ version }}/python-debian-${{ version }}.tar.gz
    sha256: dcb2643403363a244d3a36d19149fb33fd085e097cc7cfd595af8dc73b032f61


build:
  number: 0
  noarch: python
  script:
    - cd dist
    - ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation --disable-pip-version-check

requirements:
  host:
    - pip
    - python ${{ python_min }}.*
    - setuptools >=61
    - setuptools-scm >=6.2
    - wheel
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports: debian
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - ${{ python_check_max }}.*
  - files:
      source:
        - src/conftest.py
        - src/pyproject.toml
        - src/tests/
    requirements:
      run:
        - python ${{ python_min }}.*
        - pytest-cov
    script:
      - cd src
      - coverage run --source=debian --branch -m pytest -vv --tb=long --color=yes
      - coverage report --show-missing --skip-covered --fail-under=80

about:
  license: GPL-2.0-or-later
  license_file: gpl-2.0.txt
  summary: Debian package related modules
  homepage: https://pypi.org/project/python-debian
  repository: https://salsa.debian.org/python-debian-team/python-debian

extra:
  recipe-maintainers:
    - mbargull
    - bollwyvl
